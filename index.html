<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibtex Sorter</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background-color: #f4f7f6; color: #333; }
        h1 { color: #2c3e50; text-align: center; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .upload-section { 
            border: 2px dashed #3498db; 
            padding: 40px; 
            text-align: center; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            background-color: #fff;
        }
        .upload-section.dragover { 
            background-color: #ebf5fb; 
            border-color: #2ecc71; 
            transform: scale(1.02);
        }
        
        #fileInput { display: none; }
        .btn { display: block; width: 100%; padding: 12px; margin-top: 20px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn-sort { background-color: #3498db; color: white; }
        .btn-sort:hover { background-color: #2980b9; }
        .btn-download { background-color: #27ae60; color: white; display: none; }
        .btn-download:hover { background-color: #219150; }
        .status { margin-top: 15px; font-weight: bold; text-align: center; }
        footer { font-size: 0.85em; color: #7f8c8d; text-align: center; margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Bibtex Sorter</h1>
    
    <div id="dropZone" class="upload-section">
        <p id="fileName">Click to select or drag your .bib file here</p>
        <input type="file" id="fileInput" accept=".bib">
    </div>

    <button id="sortBtn" class="btn btn-sort">Sort Alphabetically by ID</button>
    <button id="downloadBtn" class="btn btn-download">Download Sorted File</button>
    
    <div id="status" class="status"></div>
    
    <footer>
        <strong>Author:</strong> Afonso Manata <br>
        <strong>Date:</strong> 2026-01-29
    </footer>
</div>

<script>
    (function() {
        var sortedContent = "";
        var selectedFile = null;
        var fileInput = document.getElementById('fileInput');
        var dropZone = document.getElementById('dropZone');
        var fileName = document.getElementById('fileName');
        var sortBtn = document.getElementById('sortBtn');
        var downloadBtn = document.getElementById('downloadBtn');
        var status = document.getElementById('status');

        // Eventos com funções tradicionais para compatibilidade total
        dropZone.onclick = function() { fileInput.click(); };

        var preventDefaults = function(e) {
            e.preventDefault();
            e.stopPropagation();
        };

        var events = ['dragenter', 'dragover', 'dragleave', 'drop'];
        for (var i = 0; i < events.length; i++) {
            dropZone.addEventListener(events[i], preventDefaults, false);
        }

        dropZone.addEventListener('dragenter', function() { dropZone.classList.add('dragover'); }, false);
        dropZone.addEventListener('dragover', function() { dropZone.classList.add('dragover'); }, false);
        dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('dragover'); }, false);
        dropZone.addEventListener('drop', function(e) { 
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files); 
        }, false);

        fileInput.onchange = function(e) {
            handleFiles(e.target.files);
        };

        function handleFiles(files) {
            if (files && files.length > 0) {
                selectedFile = files[0];
                fileName.innerHTML = "Selected file: " + selectedFile.name;
                status.innerHTML = "";
                downloadBtn.style.display = "none";
            }
        }

        sortBtn.onclick = function() {
            if (!selectedFile) {
                status.innerHTML = "Please select or drop a file first.";
                status.style.color = "#e74c3c";
                return;
            }

            var reader = new FileReader();
            reader.onload = function(e) {
                var content = e.target.result;
                try {
                    sortedContent = processBibtex(content);
                    status.innerHTML = "✅ Successfully sorted!";
                    status.style.color = "#27ae60";
                    downloadBtn.style.display = "block";
                } catch (err) {
                    status.innerHTML = "Error processing the Bibtex file.";
                    status.style.color = "#e74c3c";
                }
            };
            reader.readAsText(selectedFile);
        };

        function processBibtex(text) {
            // Split tradicional compatível com Regex de browsers antigos
            var entries = text.split(/(?=@\w+\{)/g);
            var filtered = [];
            for (var i = 0; i < entries.length; i++) {
                if (entries[i].trim().length > 0) filtered.push(entries[i]);
            }

            var parsedEntries = [];
            for (var j = 0; j < filtered.length; j++) {
                var entry = filtered[j];
                var match = entry.match(/@\w+\{([^,]+),/);
                parsedEntries.push({
                    id: match ? match[1].trim() : "zzz_unknown",
                    content: entry.trim()
                });
            }

            parsedEntries.sort(function(a, b) {
                return a.id.toLowerCase().localeCompare(b.id.toLowerCase());
            });

            var result = "";
            for (var k = 0; k < parsedEntries.length; k++) {
                result += parsedEntries[k].content + "\n\n";
            }
            return result;
        }

        downloadBtn.onclick = function() {
            var blob = new Blob([sortedContent], { type: 'text/plain;charset=utf-8' });
            var url = (window.URL || window.webkitURL).createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = "sorted_references.bib";
            document.body.appendChild(a);
            a.click();
            
            // Pequeno delay para browsers que limpam o cache agressivamente
            setTimeout(function() {
                document.body.removeChild(a);
                (window.URL || window.webkitURL).revokeObjectURL(url);
            }, 100);
        };
    })();
</script>

</body>
</html>
